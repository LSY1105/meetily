[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = "14.2"
# whisper-rs-sys's local bindgen produces an opaque whisper_full_params
# struct on Windows MSVC, breaking whisper-rs 0.13.x's direct field
# access. Force use of the shipped field-expanded bindings.rs.
WHISPER_DONT_GENERATE_BINDINGS = "1"