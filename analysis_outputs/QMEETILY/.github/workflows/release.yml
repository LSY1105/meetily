name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  sidecar:
    name: Bundle sidecar binaries
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sidecar
        shell: bash
        run: |
          cd sidecar
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[build]"
          pyinstaller --onefile --name qmeetily-sidecar qmeetily_sidecar/server.py \
              --distpath dist --workpath build --specpath .

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmeetily-sidecar-${{ matrix.os }}
          path: sidecar/dist/qmeetily-sidecar*

  tauri:
    name: Build Tauri app
    needs: sidecar
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: deb
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: appimage
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: qmeetily-sidecar-${{ matrix.os }}
          path: sidecar/dist

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmeetily-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/${{ matrix artifact }}/*

  publish:
    name: Publish GitHub Release
    needs: tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
