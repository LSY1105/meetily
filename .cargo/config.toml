[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

# ponytail: removed the prior `+crt-static` rustflag — it caused llama.cpp's
# cmake-built .lib to mismatch rustc's default-link CRT (linker errored on
# `__imp_fmaxf`, `__imp_log2`, etc.). The workspace now uses dynamic CRT
# uniformly: cmake builds llama.cpp with /MD (default), whisper-rs-sys uses
# /MD, and rustc links msvcrt.lib by default. If RuntimeLibrary LNK2038
# errors return, the right fix is upstream (whisper-rs-sys), not here.
[target.x86_64-pc-windows-msvc]
[target.aarch64-pc-windows-msvc]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = "14.2"
# whisper-rs-sys's local bindgen produces layout tests anchored at glibc
# sizes that overflow at compile time on Windows MSVC. The patch at
# patches/whisper-rs-sys-0.11.1/ strips them from src/bindings.rs; this
# env var makes sys's build.rs copy that file instead of regenerating it.
# See patches/README.md.
WHISPER_DONT_GENERATE_BINDINGS = "1"